name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 0 * * 1'  # 매주 월요일 00:00 UTC (한국시간 09:00)
    - cron: '0 0 * * 4'  # 매주 목요일 00:00 UTC (한국시간 09:00)
  workflow_dispatch:      # 수동 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s \
            -H "apikey: ${{ secrets.SUPA_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPA_KEY }}" \
            -H "Accept-Profile: flashcard" \
            "https://wyujirkoyzhyetrpyyhx.supabase.co/rest/v1/decks?limit=1" \
            -o /dev/null -w "Status: %{http_code}\n"
