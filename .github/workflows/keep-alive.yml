name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 00:00 UTC (한국시간 09:00)
  workflow_dispatch:      # 수동 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (INSERT)
        run: |
          curl -s -i \
            -X POST \
            -H "apikey: ${{ secrets.SUPA_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPA_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://wyujirkoyzhyetrpyyhx.supabase.co/rest/v1/ping" \
            -w "\nStatus: %{http_code}\n"