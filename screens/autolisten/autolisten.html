<div id="screen-autolisten" class="screen">
  <div class="nav">
    <button class="back-btn" onclick="exitAutoListen()">←</button>
    <div style="flex:1">
      <div class="nav-title">🎧 자동 듣기</div>
      <div class="nav-sub" id="al-deck-info"></div>
    </div>
  </div>

  <!-- 현재 카드 표시 -->
  <div style="border-radius:20px;background:var(--card-bg);border:1px solid var(--card-border);padding:30px 20px;text-align:center;margin-bottom:18px">
    <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#999;margin-bottom:12px" id="al-progress">- / -</div>
    <div id="al-eval-badge" style="display:none;font-size:12px;font-weight:700;margin-bottom:10px"></div>
    <div style="font-weight:800;font-size:24px;color:#111;word-break:keep-all;overflow-wrap:break-word" id="al-front">준비 중...</div>
    <div style="width:60%;height:1px;background:#e5e5e5;margin:14px auto"></div>
    <div style="font-weight:700;font-size:17px;color:#888;word-break:keep-all;overflow-wrap:break-word" id="al-back"></div>
    <div style="font-size:12px;color:#aaa;margin-top:10px" id="al-hint"></div>
  </div>

  <!-- 평가 버튼 (듣다가 평가 → 다음 턴에 반영) -->
  <div style="display:flex;gap:8px;margin-bottom:16px">
    <button id="al-eval-dont" onclick="alEvaluate('dont')" style="flex:1;padding:11px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid #e53e3e44;background:#e53e3e14;color:#e53e3e">😅 몰랐어요</button>
    <button id="al-eval-maybe" onclick="alEvaluate('maybe')" style="flex:1;padding:11px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid #d9770644;background:#d9770614;color:#d97706">💭 애매해요</button>
    <button id="al-eval-know" onclick="alEvaluate('know')" style="flex:1;padding:11px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid #16a34a44;background:#16a34a14;color:#16a34a">✅ 알았어요</button>
  </div>

  <!-- 재생 컨트롤 (SVG) -->
  <div style="display:flex;align-items:center;justify-content:center;gap:28px;margin-bottom:6px">
    <button onclick="alPrev()" style="background:none;border:none;color:var(--text);cursor:pointer;padding:8px;display:flex">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg>
    </button>
    <button id="al-play-btn" onclick="alTogglePlay()" style="background:var(--accent);border:none;color:var(--bg);cursor:pointer;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center">
      <svg id="al-icon-play" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="display:none;margin-left:3px"><path d="M8 5v14l11-7z"/></svg>
      <svg id="al-icon-pause" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <button onclick="alNext()" style="background:none;border:none;color:var(--text);cursor:pointer;padding:8px;display:flex">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
    </button>
  </div>
  <div style="text-align:center;font-size:11px;color:var(--muted);margin-bottom:20px" id="al-status-text">재생 중</div>

  <!-- 재생 방식 프리셋 (외국어 덱만) -->
  <div id="al-preset-section" style="display:none">
    <label class="form-label">재생 방식</label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
      <button class="al-preset-btn" id="al-preset-normal" onclick="alSetPreset('normal')" style="padding:12px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--bg);color:var(--muted)">🔤 일반 듣기</button>
      <button class="al-preset-btn" id="al-preset-focus" onclick="alSetPreset('focus')" style="padding:12px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--bg);color:var(--muted)">🎯 집중 암기</button>
      <button class="al-preset-btn" id="al-preset-flow" onclick="alSetPreset('flow')" style="padding:12px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--bg);color:var(--muted)">👂 흘려듣기</button>
      <button class="al-preset-btn" id="al-preset-custom" onclick="alSetPreset('custom')" style="padding:12px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--bg);color:var(--muted)">⚙️ 커스텀</button>
    </div>
    <div id="al-preset-desc" style="font-size:12px;color:var(--accent2);text-align:center;margin-bottom:16px"></div>
  </div>

  <!-- 낭독 순서 / 반복 횟수 (외국어 덱 + 커스텀 선택 시만) -->
  <div id="al-custom-section" style="display:none">
    <label class="form-label">낭독 순서</label>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
      <button class="al-order-btn" id="al-order-ftob" onclick="alSetOrder('ftob')" style="flex:1;min-width:80px;padding:9px 6px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--bg);color:var(--muted)">외국어→뜻</button>
      <button class="al-order-btn" id="al-order-btof" onclick="alSetOrder('btof')" style="flex:1;min-width:80px;padding:9px 6px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--bg);color:var(--muted)">뜻→외국어</button>
      <button class="al-order-btn" id="al-order-fonly" onclick="alSetOrder('fonly')" style="flex:1;min-width:80px;padding:9px 6px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--bg);color:var(--muted)">외국어만</button>
      <button class="al-order-btn" id="al-order-wrap" onclick="alSetOrder('wrap')" style="flex:1;min-width:80px;padding:9px 6px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--bg);color:var(--muted)">뜻·외국어·뜻</button>
    </div>
    <label class="form-label">외국어 반복 횟수</label>
    <div style="display:flex;gap:6px;margin-bottom:14px">
      <button class="al-rep-btn" id="al-rep-1" onclick="alSetRepeat(1)" style="flex:1;padding:9px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--bg);color:var(--muted)">1회</button>
      <button class="al-rep-btn" id="al-rep-2" onclick="alSetRepeat(2)" style="flex:1;padding:9px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--bg);color:var(--muted)">2회</button>
      <button class="al-rep-btn" id="al-rep-3" onclick="alSetRepeat(3)" style="flex:1;padding:9px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--bg);color:var(--muted)">3회</button>
      <button class="al-rep-btn" id="al-rep-5" onclick="alSetRepeat(5)" style="flex:1;padding:9px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--bg);color:var(--muted)">5회</button>
    </div>
  </div>

  <!-- 간격 / 속도 / 덱 끝나면 (모든 덱 공통, 프리셋 선택 시에도 조절 가능) -->
  <div id="al-simple-section" style="display:none">
    <label class="form-label">간격</label>
    <div style="display:flex;gap:6px;margin-bottom:14px">
      <button class="al-gap-btn" id="al-gap-short" onclick="alSetGap('short')" style="flex:1;padding:9px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--bg);color:var(--muted)">짧게</button>
      <button class="al-gap-btn" id="al-gap-normal" onclick="alSetGap('normal')" style="flex:1;padding:9px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--bg);color:var(--muted)">보통</button>
      <button class="al-gap-btn" id="al-gap-long" onclick="alSetGap('long')" style="flex:1;padding:9px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--bg);color:var(--muted)">길게</button>
    </div>
    <label class="form-label">재생 속도</label>
    <div style="display:flex;gap:6px;margin-bottom:14px">
      <button class="al-rate-btn" id="al-rate-075" onclick="alSetRate(0.75)" style="flex:1;padding:9px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--bg);color:var(--muted)">0.75x</button>
      <button class="al-rate-btn" id="al-rate-100" onclick="alSetRate(1)" style="flex:1;padding:9px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--bg);color:var(--muted)">1.0x</button>
      <button class="al-rate-btn" id="al-rate-125" onclick="alSetRate(1.25)" style="flex:1;padding:9px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--bg);color:var(--muted)">1.25x</button>
    </div>
    <label class="form-label">덱 끝나면</label>
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <button id="al-loop-on" onclick="alSetLoop(true)" style="flex:1;padding:10px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--bg);color:var(--muted)">🔁 반복</button>
      <button id="al-loop-off" onclick="alSetLoop(false)" style="flex:1;padding:10px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--bg);color:var(--muted)">⏹ 정지</button>
    </div>
  </div>
</div>
